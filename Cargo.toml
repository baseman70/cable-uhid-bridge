[package]
name = "cable-uhid-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Chris Sommers <chris.sommers@icloud.com>"]
description = "Linux virtual USB FIDO2/WebAuthn token bridge for mobile passkeys via caBLE v2 (QR code)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baseman70/cable-uhid-bridge"

[dependencies]
uhidrs-sys = "1.0.4"
libc = "0.2"
enumflags2 = "0.7"
ctaphid-types = "0.2.0"
webauthn-authenticator-rs = { version = "0.6.1-dev", features = ["cable", "qrcode", "ui-cli", "crypto"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
eframe = "0.36.2"
qrcode = "0.12"
sha2 = "0.10"
hex = "0.4"

[patch.crates-io]
webauthn-authenticator-rs = { path = "vendor/webauthn-authenticator-rs" }
